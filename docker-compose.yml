services:
  gateway:
    build: .
    environment:
      BABEL_STATE_DIR: /state
      SERVICE_A_URL: http://service-a:8101
      SERVICE_B_HOST: service-b
      SERVICE_B_PORT: "8201"
      SERVICE_C_HOST: service-c
      SERVICE_C_PORT: "8301"
    ports:
      - "8080:8080"
    volumes:
      - gateway-state:/state
      - ./plugins:/plugins:ro
    networks: [babel-network]
    init: true
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    pids_limit: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/status', timeout=3).read()"]
      interval: 5s
      timeout: 4s
      retries: 6
      start_period: 3s
    depends_on:
      - service-a
      - service-b
      - service-c

  service-a:
    image: babel-go-service-a:local
    environment:
      BABEL_STATE_DIR: /state
      BABEL_SEED: ${BABEL_SEED:-1}
    ports:
      - "127.0.0.1:8101:8101"
    volumes:
      - babel-state:/state
    networks: [babel-network]

  service-b:
    image: babel-go-service-b:local
    environment:
      BABEL_STATE_DIR: /state
      BABEL_SEED: ${BABEL_SEED:-1}
    ports:
      - "127.0.0.1:8201:8201"
    volumes:
      - babel-state:/state
    networks: [babel-network]

  service-c:
    image: babel-go-service-c:local
    environment:
      BABEL_STATE_DIR: /state
      BABEL_SEED: ${BABEL_SEED:-1}
    ports:
      - "127.0.0.1:8301:8301/udp"
    volumes:
      - babel-state:/state
    networks: [babel-network]

  control-plane:
    image: babel-go-control-plane:local
    environment:
      BABEL_STATE_DIR: /state
      BABEL_SEED: ${BABEL_SEED:-1}
      BABEL_CONTROL_TOKEN: ${BABEL_CONTROL_TOKEN:-babel-local-dev}
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - babel-state:/state
    networks: [babel-network]

networks:
  babel-network:
    name: babel-network

volumes:
  babel-state:
  gateway-state:
